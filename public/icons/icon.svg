    <path d="M46 7 C47.3 16.2 49.8 18.7 59 20 C49.8 21.3 47.3 23.8 46 33 C44.7 23.8 42.2 21.3 33 20 C42.2 18.7 44.7 16.2 46 7Z" fill="#fff"/>
